name: Publish Retype powered website to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish to retype branch
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This step mimics your local environment's capability to run the dotnet tool
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x 

      - name: Build Retype
        uses: retypeapp/action-build@latest
        with:
          # This forces the action to run 'dotnet tool install' for this specific version
          version: 4.5.0-preview5
        env:
          RETYPE_KEY: ${{ secrets.RETYPE_KEY }}
          RETYPE_PASSWORD: ${{ secrets.RETYPE_PASSWORD }}          

      - name: Deploy to GitHub Pages
        uses: retypeapp/action-github-pages@latest
        with:
          update-branch: true