input: .
output: .retype

url: pg.sitarz.net # Use your website address

start:
  # Uncomment the next line to try Retype Pro features
  pro: true

meta:
  title: " • pg.sitarz.net"

head:
  meta:
    - name: pg.sitarz.net
      content: ""
    - name: keywords
      content: ""  

branding:
  logo: imgs/logo.png
  logoDark: imgs/logo.png
  logoHeight: 40

links:
- text: Home
  link: /

- text: "@pgsitarz"
  link: "https://github.com/pgsitarz"
  icon: "mark-github"  

static: static

brand:
  favicon: /static/favicon.ico

footer:
  copyright: "&copy; {{ year }} sitarz.net. All rights reserved."

templating:
  enabled: true

nav:
  sidebar:
    enabled: true
    title: "Notes"
    collapsible: true
    collapsed: false
  tags:
    enabled: true # or false, default is true
    limit: 100 # return all tags unless limit is set
    exclude: [] # a list of specific tags to exclude
    include: [] # a list of specific tags to include
    layout: flex # flex or stack
    order: asc # options include desc, asc, count
    variant: info # any tag variant

blog:
  layout: page
  pageSize: 5
  maxResults: 100
  title: Blog
  # 1. Keeps the left sidebar visible while reading a post
  sidebar: true      
  # 2. Hides the individual posts from the sidebar menu tree
  navigation: false  
  rss:
    title: Blog Posts
    description: Latest blog posts