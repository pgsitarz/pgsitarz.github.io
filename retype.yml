input: .
output: .retype

url: pgsitarz.github.io # Use your website address here

start:
  # Uncomment the next line to try Retype Pro features
  pro: true

meta:
  title: " • sitarz.net"

head:
  meta:
    - name: pgsitarz.github.io
      content: ""
    - name: keywords
      content: ""  

branding:
  logo: imgs/logo.png
  logoDark: imgs/logo.png
  logoHeight: 40

links:
- text: Home
  link: /

- text: "@pgsitarz"
  link: "https://github.com/pgsitarz"
  icon: "mark-github"  

edit:
  repo: https://github.com/pgsitarz/sitarz-pg/blob
  base: /
  label: Edit this page

static: static

brand:
  favicon: /static/favicon.ico

footer:
  copyright: "&copy; {{ year }} sitarz.net. All rights reserved."

templating:
  enabled: true

nav:
  sidebar:
    enabled: true
    title: "Notes"
    collapsible: true
    collapsed: false
  tags:
    enabled: true # or false, default is true
    limit: 100 # return all tags unless limit is set
    exclude: [] # a list of specific tags to exclude
    include: [] # a list of specific tags to include
    layout: stack
    order: asc # options include desc, asc, count
    variant: info # any tag variant